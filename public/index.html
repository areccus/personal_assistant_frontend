<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- user-scalable=no locks zoom like a native app; no viewport-fit=cover (iOS handles safe areas natively) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ── iOS PWA Standalone Mode ─────────────────────────────────────────
         apple-mobile-web-app-capable is the critical tag. Without it, tapping
         the home screen icon will always open in Safari instead of standalone.
    ─────────────────────────────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZeroClaw" />

    <!-- Theme color for the browser chrome (also used by Android) -->
    <meta name="theme-color" content="#131314" />

    <!-- Prevent iOS from linkifying phone numbers / addresses -->
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="ZeroClaw AI Assistant" />

    <!-- ── Icons ── -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- iOS reads apple-touch-icon for the home screen icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- ── Web App Manifest ── -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>ZeroClaw</title>

    <!-- ── Fonts ── -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    <!-- Prevent white flash before React mounts — must match --bg color -->
    <style>
      html { height: 100dvh; background: #131314; margin: 0; padding: 0; }
      body, #root { height: 100%; background: #131314; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
